  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CloudSOC{% endblock %}</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
