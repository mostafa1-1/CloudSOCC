steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/cloudsoc:latest", "-f", "deployment/Dockerfile", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/cloudsoc:latest"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "cloudsoc-service"
      - "--image=gcr.io/$PROJECT_ID/cloudsoc:latest"
      - "--region=europe-west2"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=3"
images:
  - "gcr.io/$PROJECT_ID/cloudsoc:latest"
